<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8CCAF3" />
    <title>Sky Circuit</title>
    <meta name="description" content="A toy-scale racing diorama on floating islands. Meet the teams, run a 2.4 second pit stop, celebrate on the podium." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="Sky Circuit island. Press Tab to cycle through cars, drivers and crew, Enter to select, Escape to go back." tabindex="0"></canvas>
    <div id="ui">
      <header class="topbar">
        <div class="brand"><span class="mark" aria-hidden="true"></span><span>Sky Circuit</span></div>
        <button id="btn-menu" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="game-nav"><span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span></button>
        <nav class="actions-top" id="game-nav" aria-label="Game">
          <button id="btn-drive" class="primary">🏎 Drive</button>
          <button id="btn-explore">🚶 Walk in</button>
          <button id="btn-pit">Pit stop challenge</button>
          <button id="btn-podium">Podium</button>
          <button id="btn-rain" aria-pressed="false">Rain</button>
          <a id="btn-creator" class="btn-link" href="/creator/">🧑 My character</a>
          <a id="btn-cards" class="btn-link" href="/card/">🃏 Cards</a>
          <a id="btn-learn" class="btn-link" href="/learn/">📘 Learn</a>
          <button id="btn-help" aria-label="Controls help">?<span class="menu-label"> Help</span></button>
        </nav>
      </header>
      <div id="loading" class="loading">Building the islands…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
